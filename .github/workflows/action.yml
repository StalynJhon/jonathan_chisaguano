name: testfalla

# Se ejecuta solo al hacer push a la rama 'chisaguano'
on:
  push:
    branches:
      - chisaguano

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    # Clonar el repositorio
    - name: Checkout repository
      uses: actions/checkout@v3

    # Configurar Python
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    # Instalar dependencias (Flask y pytest)
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flask pytest

    # 4️⃣ Ejecutar tests
    - name: Run tests
      run: |
        python -m unittest test.py
